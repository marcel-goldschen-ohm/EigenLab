name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        eigen: [3.2.10, 3.3.9, 3.4.1, 5.0.1]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build -DEIGEN_VERSION=${{ matrix.eigen }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
